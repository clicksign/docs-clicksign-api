<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do Servidor</title>
  <link rel="stylesheet" href="/estilo.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 10px 14px;
      gap: 8px;
      background: var(--superficie);
      font-size: 14px;
      overflow: hidden;
    }
    header { display: flex; align-items: center; gap: 10px; }
    header strong { font-size: 16px; }
    #estado {
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      background: var(--sucesso);
    }
    #estado.instavel { background: var(--timeout); }
    #modo { color: var(--texto-suave); font-size: 12px; }
    #numeros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    #numeros div { display: flex; flex-direction: column; }
    #numeros span { font-size: 22px; font-weight: 700; }
    #numeros small { color: var(--texto-suave); font-size: 12px; line-height: 1.25; }
    #grafico { flex: 1; min-height: 0; }
    #grafico svg { width: 100%; height: 100%; display: block; }
    .eixo { fill: var(--texto-apagado); font-size: 11px; }
    .grade { stroke: var(--borda); stroke-width: 1; }
    .capacidade { stroke: var(--texto-suave); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .rotulo-capacidade { fill: var(--texto-suave); font-size: 11px; }
    .instavel { fill: var(--faixa-instavel); }
    footer { display: flex; gap: 14px; align-items: center; color: var(--texto-suave); font-size: 12px; flex-wrap: wrap; }
    footer i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  </style>
</head>
<body>
  <header>
    <strong>Servidor</strong>
    <span id="estado">estável</span>
    <span id="modo"></span>
  </header>

  <section id="numeros">
    <div><span id="chegando">0</span><small>ligações por segundo chegando</small></div>
    <div><span id="capacidade">3,3</span><small>capacidade por segundo</small></div>
    <div><span id="recusadas">0%</span><small>recusadas pelo rate limit (10 s)</small></div>
    <div><span id="travados">0</span><small>atendentes presos em ligações que o cliente já desligou</small></div>
  </section>

  <div id="grafico"></div>

  <footer>
    <span><i style="background: var(--sucesso)"></i>200 atendida</span>
    <span><i style="background: var(--limite)"></i>429 recusada</span>
    <span><i style="background: var(--timeout)"></i>travou (timeout)</span>
    <span><i style="background: var(--faixa-instavel); outline: 1px solid var(--timeout)"></i>segundo instável</span>
    <span>- - - capacidade</span>
  </footer>

  <script type="module" src="painel.js"></script>
</body>
</html>
